version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vibeztube_postgres
    restart: always
    environment:
      POSTGRES_USER: vibeztube_user
      POSTGRES_PASSWORD: vibeztube_secure_pwd_998
      POSTGRES_DB: vibeztube_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vibeztube_net

  redis:
    image: redis:7-alpine
    container_name: vibeztube_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vibeztube_net

  minio:
    image: minio/minio:latest
    container_name: vibeztube_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - vibeztube_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibeztube_web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
      - minio
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vibeztube_user:vibeztube_secure_pwd_998@vibeztube_postgres:5432/vibeztube_db?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://vibeztube_minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=vibeztube-bucket
      - NEXT_PUBLIC_MINIO_EXTERNAL_URL=
    networks:
      - vibeztube_net

  nginx:
    image: nginx:alpine
    container_name: vibeztube_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - vibeztube_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  vibeztube_net:
    driver: bridge
